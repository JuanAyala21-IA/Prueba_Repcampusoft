<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="840" viewBox="0 0 1500 840" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6B7B"/>
    </marker>
  </defs>

  <rect width="1500" height="840" fill="#FFFFFF"/>

  <!-- Contenedor Firebase -->
  <rect x="380" y="40" width="840" height="760" rx="28" fill="#FAFCF2" stroke="#B8D400" stroke-width="3" stroke-dasharray="10 7"/>
  <text x="404" y="72" font-size="18" font-weight="700" fill="#556000">Proyecto Firebase «repcampusoft» · plan Spark (Blaze para push)</text>

  <!-- App movil -->
  <g filter="url(#sombra)">
    <rect x="40" y="330" width="290" height="230" rx="20" fill="#E3F0FC" stroke="#4A7FB5" stroke-width="2.5"/>
  </g>
  <rect x="62" y="352" width="26" height="44" rx="5" fill="#FFFFFF" stroke="#4A7FB5" stroke-width="2"/>
  <rect x="67" y="358" width="16" height="28" rx="2" fill="#4A7FB5" opacity="0.25"/>
  <circle cx="75" cy="391" r="2" fill="#4A7FB5"/>
  <text x="102" y="374" font-size="24" font-weight="800" fill="#111111">App móvil</text>
  <text x="102" y="400" font-size="20" font-weight="700" fill="#1F4E79">Flutter (Android / iOS)</text>
  <text x="64" y="446" font-size="18" fill="#111111">• Material Design</text>
  <text x="64" y="476" font-size="18" fill="#111111">• Riverpod: estado y providers</text>
  <text x="64" y="506" font-size="18" fill="#111111">• Persistencia offline</text>
  <text x="64" y="536" font-size="18" fill="#111111">• Notificaciones locales</text>

  <!-- Firebase Authentication -->
  <g filter="url(#sombra)">
    <rect x="420" y="90" width="300" height="120" rx="16" fill="#FFF6E0" stroke="#D9A53C" stroke-width="2.5"/>
  </g>
  <circle cx="456" cy="132" r="20" fill="#FFFFFF" stroke="#D9A53C" stroke-width="2"/>
  <rect x="448" y="129" width="16" height="13" rx="3" fill="#D9A53C"/>
  <path d="M451 129 v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#D9A53C" stroke-width="2"/>
  <text x="488" y="128" font-size="21" font-weight="800" fill="#111111">Firebase Authentication</text>
  <text x="442" y="160" font-size="17" fill="#333333">Login con correo y Google</text>
  <text x="442" y="184" font-size="17" fill="#333333">Verificación de correo y token</text>

  <!-- Firebase Cloud Messaging -->
  <g filter="url(#sombra)">
    <rect x="880" y="90" width="310" height="120" rx="16" fill="#FFE9D6" stroke="#E07A3F" stroke-width="2.5"/>
  </g>
  <path d="M914 150 q0 -26 22 -26 q6 -14 20 -10 q16 4 16 20 q12 4 10 16 z" fill="#FFFFFF" stroke="#E07A3F" stroke-width="2"/>
  <text x="900" y="128" font-size="20" font-weight="800" fill="#111111">Firebase Cloud Messaging</text>
  <text x="900" y="160" font-size="17" fill="#333333">Push con la app cerrada</text>
  <text x="900" y="184" font-size="17" fill="#333333">Token FCM · plan Blaze</text>

  <!-- Cloud Functions -->
  <rect x="880" y="230" width="310" height="60" rx="12" fill="#FFF9EC" stroke="#8A6D3B" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1035" y="266" font-size="17" font-weight="700" fill="#5C4A22" text-anchor="middle">Cloud Functions · onCreate → push</text>

  <!-- Cloud Firestore -->
  <g filter="url(#sombra)">
    <rect x="420" y="290" width="390" height="190" rx="16" fill="#FDE6D2" stroke="#E07A3F" stroke-width="2.5"/>
  </g>
  <ellipse cx="458" cy="326" rx="20" ry="7" fill="#FFFFFF" stroke="#E07A3F" stroke-width="2"/>
  <path d="M438 326 v16 c0 4 9 7 20 7 s20 -3 20 -7 v-16" fill="#FFFFFF" stroke="#E07A3F" stroke-width="2"/>
  <path d="M438 342 v16 c0 4 9 7 20 7 s20 -3 20 -7 v-16" fill="#FFFFFF" stroke="#E07A3F" stroke-width="2"/>
  <text x="492" y="330" font-size="22" font-weight="800" fill="#111111">Cloud Firestore</text>
  <text x="442" y="372" font-size="18" fill="#111111">• Reportes e historial de estados</text>
  <text x="442" y="400" font-size="18" fill="#111111">• Usuarios, roles y estado de cuenta</text>
  <text x="442" y="428" font-size="18" fill="#111111">• Notificaciones y catálogos</text>
  <text x="442" y="456" font-size="18" fill="#111111">• Media (foto y evidencia)</text>

  <!-- Firebase Storage -->
  <g filter="url(#sombra)">
    <rect x="880" y="320" width="310" height="120" rx="16" fill="#E4F3E4" stroke="#4F9A5A" stroke-width="2.5"/>
  </g>
  <path d="M904 360 h30 l8 10 h30 v34 h-68 z" fill="#FFFFFF" stroke="#4F9A5A" stroke-width="2"/>
  <text x="900" y="358" font-size="21" font-weight="800" fill="#111111">Firebase Storage</text>
  <text x="900" y="390" font-size="17" fill="#333333">Fotos de evidencia</text>
  <text x="900" y="414" font-size="17" fill="#333333">subida / descarga por HTTPS</text>

  <!-- Reglas de seguridad -->
  <g filter="url(#sombra)">
    <rect x="430" y="640" width="360" height="110" rx="16" fill="#EEF1F5" stroke="#5A6B7B" stroke-width="2.5"/>
  </g>
  <path d="M466 670 l20 -8 l20 8 v16 q0 16 -20 24 q-20 -8 -20 -24 z" fill="#FFFFFF" stroke="#5A6B7B" stroke-width="2"/>
  <text x="516" y="678" font-size="21" font-weight="800" fill="#111111">Reglas de seguridad</text>
  <text x="452" y="708" font-size="17" fill="#333333">Firestore + Storage: autoría, rol y estado</text>
  <text x="452" y="732" font-size="17" fill="#333333">Validación en el servidor (defensa en capas)</text>

  <!-- GitHub -->
  <g filter="url(#sombra)">
    <rect x="1250" y="640" width="220" height="110" rx="16" fill="#F2F3F5" stroke="#3C4043" stroke-width="2.5"/>
  </g>
  <circle cx="1286" cy="674" r="16" fill="#3C4043"/>
  <text x="1308" y="682" font-size="21" font-weight="800" fill="#111111">GitHub</text>
  <text x="1270" y="712" font-size="17" fill="#333333">Repositorio y versiones</text>
  <text x="1270" y="736" font-size="17" fill="#333333">Build del APK</text>

  <!-- Flechas -->
  <!-- App -> Auth -->
  <path d="M330 350 L415 185" fill="none" stroke="#333333" stroke-width="2.2" marker-end="url(#flecha)"/>
  <text x="318" y="276" font-size="16" fill="#333333" transform="rotate(-58 318 276)">HTTPS · login / token</text>

  <!-- App <-> Firestore -->
  <path d="M330 415 L415 390" fill="none" stroke="#333333" stroke-width="2.2" marker-end="url(#flecha)"/>
  <text x="345" y="432" font-size="14" fill="#333333">HTTPS</text>
  <text x="338" y="450" font-size="14" fill="#333333">listeners</text>

  <!-- App <-> Storage (fotos) -->
  <path d="M330 510 L400 510 L400 590 L1080 590 L1080 445" fill="none" stroke="#333333" stroke-width="2.2" marker-end="url(#flecha)"/>
  <text x="620" y="578" font-size="16" fill="#333333">HTTPS · subida y descarga de fotos</text>

  <!-- Firestore -> Functions -->
  <path d="M810 300 L875 262" fill="none" stroke="#333333" stroke-width="2.2" marker-end="url(#flecha)"/>
  <text x="812" y="278" font-size="15" fill="#333333">onCreate</text>

  <!-- Functions -> FCM -->
  <path d="M1035 230 L1035 214" fill="none" stroke="#333333" stroke-width="2.2" marker-end="url(#flecha)"/>

  <!-- FCM -> App (push) -->
  <path d="M880 150 L840 150 L840 255 L330 255 L330 325" fill="none" stroke="#333333" stroke-width="2.2" marker-end="url(#flecha)"/>
  <text x="558" y="245" font-size="16" fill="#333333">push (plan Blaze)</text>

  <!-- Reglas -> Firestore -->
  <path d="M610 640 L610 485" fill="none" stroke="#5A6B7B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaGris)"/>
  <text x="600" y="575" font-size="15" fill="#5A6B7B" text-anchor="end">autoriza operaciones</text>

  <!-- Reglas -> Storage -->
  <path d="M790 665 L1180 665 L1180 445" fill="none" stroke="#5A6B7B" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flechaGris)"/>
  <text x="900" y="656" font-size="15" fill="#5A6B7B">reglas de Storage</text>

  <!-- GitHub -> Reglas (deploy) -->
  <path d="M1250 700 L795 700" fill="none" stroke="#333333" stroke-width="2.2" marker-end="url(#flecha)"/>
  <text x="930" y="692" font-size="15" fill="#333333">deploy de reglas e índices (Firebase CLI)</text>
</svg>
