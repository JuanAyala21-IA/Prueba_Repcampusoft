<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2550" height="3300" viewBox="0 0 2550 3300" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
    <marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"/>
    </marker>
    <style>
      .nodo      { fill: #F4F8DC; stroke: #8FA600; stroke-width: 3; }
      .nodoAlt   { fill: #FFFFFF; stroke: #8FA600; stroke-width: 3; stroke-dasharray: 10 7; }
      .nodoGris  { fill: #F7F7F7; stroke: #6B7280; stroke-width: 3; stroke-dasharray: 10 7; }
      .titulo    { font-size: 38px; font-weight: 700; fill: #111111; text-anchor: middle; }
      .tituloLargo { font-size: 34px; font-weight: 700; fill: #111111; text-anchor: middle; }
      .numero    { font-size: 34px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .rotulo    { font-size: 34px; fill: #333333; }
      .rotuloHalo{ font-size: 34px; fill: #333333; paint-order: stroke; stroke: #FFFFFF; stroke-width: 8px; stroke-linejoin: round; }
      .flecha    { fill: none; stroke: #333333; stroke-width: 3.5; }
      .flechaPun { fill: none; stroke: #6B7280; stroke-width: 3.5; stroke-dasharray: 12 9; }
      .badge     { fill: #8FA600; }
      .seccion   { font-size: 42px; font-weight: 700; fill: #111111; }
      .sub       { font-size: 34px; fill: #555555; }
    </style>
  </defs>

  <rect width="2550" height="3300" fill="#FFFFFF"/>

  <!-- ================= ENCABEZADO ================= -->
  <rect x="236" y="96" width="10" height="62" fill="#B8D400"/>
  <text x="270" y="150" font-size="58" font-weight="800" fill="#111111">Figura 3a. Flujo de navegación del usuario</text>
  <text x="270" y="205" class="sub">REPCAMPUSOFT · Sprint 2 · Prototipos de las interfaces (1.png a 11.png)</text>
  <line x1="236" y1="240" x2="2314" y2="240" stroke="#D1D5DB" stroke-width="2"/>

  <!-- ================= FLUJO ================= -->
  <text x="236" y="298" class="seccion">Flujo de navegación</text>

  <!-- Nodo 1 -->
  <rect x="236" y="330" width="430" height="110" rx="18" class="nodo"/>
  <circle cx="270" cy="365" r="24" class="badge"/>
  <text x="270" y="377" class="numero">1</text>
  <text x="471" y="399" class="titulo">Bienvenida</text>

  <!-- Nodo 2 -->
  <rect x="880" y="330" width="430" height="110" rx="18" class="nodo"/>
  <circle cx="914" cy="365" r="24" class="badge"/>
  <text x="914" y="377" class="numero">2</text>
  <text x="1115" y="399" class="titulo">Iniciar sesión</text>

  <!-- Nodo 6 -->
  <rect x="1524" y="330" width="430" height="110" rx="18" class="nodo"/>
  <circle cx="1558" cy="365" r="24" class="badge"/>
  <text x="1558" y="377" class="numero">6</text>
  <text x="1759" y="399" class="titulo">Inicio estudiante</text>

  <!-- Nodo 3 -->
  <rect x="236" y="500" width="430" height="110" rx="18" class="nodo"/>
  <circle cx="270" cy="535" r="24" class="badge"/>
  <text x="270" y="547" class="numero">3</text>
  <text x="471" y="569" class="titulo">Registro</text>

  <!-- Nodo 4 -->
  <rect x="880" y="500" width="430" height="110" rx="18" class="nodo"/>
  <circle cx="914" cy="535" r="24" class="badge"/>
  <text x="914" y="547" class="numero">4</text>
  <text x="1115" y="569" class="titulo">Verificar correo</text>

  <!-- Nodo 5 -->
  <rect x="1524" y="500" width="430" height="110" rx="18" class="nodo"/>
  <circle cx="1558" cy="535" r="24" class="badge"/>
  <text x="1558" y="547" class="numero">5</text>
  <text x="1759" y="569" class="titulo">Completar perfil</text>

  <!-- Nodo 7 -->
  <rect x="236" y="880" width="430" height="110" rx="18" class="nodo"/>
  <circle cx="270" cy="915" r="24" class="badge"/>
  <text x="270" y="927" class="numero">7</text>
  <text x="471" y="949" class="titulo">Reportar daños</text>

  <!-- Nodo 9 -->
  <rect x="880" y="880" width="430" height="110" rx="18" class="nodo"/>
  <circle cx="914" cy="915" r="24" class="badge"/>
  <text x="914" y="927" class="numero">9</text>
  <text x="1115" y="949" class="titulo">Tus reportes</text>

  <!-- Nodo 11 -->
  <rect x="1524" y="880" width="430" height="110" rx="18" class="nodo"/>
  <circle cx="1558" cy="915" r="24" class="badge"/>
  <text x="1558" y="927" class="numero">11</text>
  <text x="1759" y="949" class="titulo">Notificaciones</text>

  <!-- Nodo 8: aviso -->
  <rect x="236" y="1050" width="430" height="110" rx="18" class="nodoAlt"/>
  <circle cx="270" cy="1085" r="24" fill="#8FA600"/>
  <text x="270" y="1097" class="numero">8</text>
  <text x="471" y="1119" class="titulo">Reporte enviado</text>

  <!-- Nodo 10 -->
  <rect x="880" y="1050" width="430" height="110" rx="18" class="nodo"/>
  <circle cx="914" cy="1085" r="24" class="badge"/>
  <text x="914" y="1097" class="numero">10</text>
  <text x="1115" y="1119" class="tituloLargo">Detalle del reporte</text>

  <!-- Nodo 12 -->
  <rect x="1524" y="1050" width="430" height="110" rx="18" class="nodoGris"/>
  <circle cx="1558" cy="1085" r="24" fill="#6B7280"/>
  <text x="1558" y="1097" class="numero">12</text>
  <text x="1759" y="1119" class="titulo">Cuenta bloqueada</text>
  <text x="1524" y="1200" class="rotulo" fill="#555555">Solo si la cuenta está inactiva</text>

  <!-- ================= FLECHAS ================= -->
  <!-- 1 -> 2 -->
  <path d="M666 385 H872" class="flecha" marker-end="url(#flecha)"/>
  <text x="773" y="310" class="rotulo" text-anchor="middle">Iniciar sesión</text>

  <!-- 2 -> 6 -->
  <path d="M1310 385 H1516" class="flecha" marker-end="url(#flecha)"/>
  <text x="1417" y="310" class="rotulo" text-anchor="middle">Credenciales válidas</text>

  <!-- 1 -> 3 -->
  <path d="M451 440 V492" class="flecha" marker-end="url(#flecha)"/>
  <text x="432" y="482" class="rotulo" text-anchor="end">Registrarse</text>

  <!-- 3 -> 4 -->
  <path d="M666 555 H872" class="flecha" marker-end="url(#flecha)"/>
  <text x="773" y="480" class="rotulo" text-anchor="middle">Correo registrado</text>

  <!-- 4 -> 5 -->
  <path d="M1310 555 H1516" class="flecha" marker-end="url(#flecha)"/>
  <text x="1417" y="480" class="rotulo" text-anchor="middle">Correo verificado</text>

  <!-- 5 -> 6 -->
  <path d="M1739 500 V442" class="flecha" marker-end="url(#flecha)"/>
  <text x="1756" y="482" class="rotulo">Perfil completo</text>

  <!-- Bus 6 -> 7, 9, 11 -->
  <path d="M1954 385 H2190 V820 H451 V872" class="flecha" marker-end="url(#flecha)"/>
  <path d="M1954 385 H2190 V820 H1095 V872" class="flecha" marker-end="url(#flecha)"/>
  <path d="M1954 385 H2190 V820 H1739 V872" class="flecha" marker-end="url(#flecha)"/>
  <text x="540" y="806" class="rotuloHalo">Reportar daños</text>
  <text x="1170" y="806" class="rotuloHalo">Tus reportes</text>
  <text x="1800" y="806" class="rotuloHalo">Notificaciones</text>

  <!-- 7 -> 8 -->
  <path d="M451 990 V1042" class="flecha" marker-end="url(#flecha)"/>
  <text x="468" y="1032" class="rotulo">Enviar reporte</text>

  <!-- 8 -> 9 -->
  <path d="M451 1050 V1010 H1000 V998" class="flecha" marker-end="url(#flecha)"/>
  <text x="700" y="998" class="rotuloHalo">Aceptar</text>

  <!-- 9 -> 10 -->
  <path d="M1095 990 V1042" class="flecha" marker-end="url(#flecha)"/>
  <text x="1112" y="1032" class="rotulo">Seleccionar</text>

  <!-- 10 -> 9 (retorno) -->
  <path d="M880 1105 H830 V935 H872" class="flechaPun" marker-end="url(#flechaGris)"/>
  <text x="815" y="1078" class="rotulo" text-anchor="end">Volver</text>

  <!-- ================= LEYENDA ================= -->
  <rect x="236" y="1230" width="980" height="180" rx="14" fill="#FAFAFA" stroke="#D1D5DB" stroke-width="2"/>
  <path d="M270 1290 H380" class="flecha" marker-end="url(#flecha)"/>
  <text x="404" y="1300" class="rotulo">Navegación directa</text>
  <path d="M270 1340 H380" class="flechaPun" marker-end="url(#flechaGris)"/>
  <text x="404" y="1350" class="rotulo">Retorno o pantalla condicionada</text>
  <rect x="270" y="1372" width="110" height="42" rx="8" fill="#FFFFFF" stroke="#8FA600" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="404" y="1402" class="rotulo">Aviso de confirmación</text>

  <text x="1260" y="1300" class="rotulo" font-weight="700">Pantallas compartidas:</text>
  <text x="1260" y="1350" class="rotulo">Perfil, Editar perfil y Cambiar contraseña.</text>

  <!-- ================= PROTOTIPOS ================= -->
  <line x1="236" y1="1445" x2="2314" y2="1445" stroke="#D1D5DB" stroke-width="2"/>
  <text x="236" y="1500" class="seccion">Prototipos de las interfaces</text>
  <text x="236" y="1542" class="sub">Diseño del Sprint 2: se conservan tal como están en docs/diseno, sin modificaciones.</text>

  <!-- Fila 1 -->
  <image x="236" y="1575" width="330" height="714" href="__IMG1__" preserveAspectRatio="xMidYMid meet"/>
  <rect x="236" y="1575" width="330" height="714" fill="none" stroke="#D1D5DB" stroke-width="2"/>
  <text x="401" y="2334" class="rotulo" text-anchor="middle">a) Iniciar sesión (1.png)</text>

  <image x="819" y="1575" width="330" height="714" href="__IMG3__" preserveAspectRatio="xMidYMid meet"/>
  <rect x="819" y="1575" width="330" height="714" fill="none" stroke="#D1D5DB" stroke-width="2"/>
  <text x="984" y="2334" class="rotulo" text-anchor="middle">b) Registro (3.png)</text>

  <image x="1402" y="1575" width="330" height="714" href="__IMG4__" preserveAspectRatio="xMidYMid meet"/>
  <rect x="1402" y="1575" width="330" height="714" fill="none" stroke="#D1D5DB" stroke-width="2"/>
  <text x="1567" y="2334" class="rotulo" text-anchor="middle">c) Inicio estudiante (4.png)</text>

  <image x="1985" y="1575" width="330" height="714" href="__IMG8__" preserveAspectRatio="xMidYMid meet"/>
  <rect x="1985" y="1575" width="330" height="714" fill="none" stroke="#D1D5DB" stroke-width="2"/>
  <text x="2150" y="2334" class="rotulo" text-anchor="middle">d) Reportar daños (8.png)</text>

  <!-- Fila 2 -->
  <image x="527" y="2365" width="330" height="714" href="__IMG10__" preserveAspectRatio="xMidYMid meet"/>
  <rect x="527" y="2365" width="330" height="714" fill="none" stroke="#D1D5DB" stroke-width="2"/>
  <text x="692" y="3124" class="rotulo" text-anchor="middle">e) Tus reportes (10.png)</text>

  <image x="1110" y="2365" width="330" height="714" href="__IMG9__" preserveAspectRatio="xMidYMid meet"/>
  <rect x="1110" y="2365" width="330" height="714" fill="none" stroke="#D1D5DB" stroke-width="2"/>
  <text x="1275" y="3124" class="rotulo" text-anchor="middle">f) Detalle del reporte (9.png)</text>

  <image x="1693" y="2365" width="330" height="714" href="__IMG11__" preserveAspectRatio="xMidYMid meet"/>
  <rect x="1693" y="2365" width="330" height="714" fill="none" stroke="#D1D5DB" stroke-width="2"/>
  <text x="1858" y="3124" class="rotulo" text-anchor="middle">g) Notificaciones (11.png)</text>
</svg>
