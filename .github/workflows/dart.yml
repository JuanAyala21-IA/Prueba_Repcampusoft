name: iOS-ipa-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: iOS Build (IPA sin firma)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: x64

      # SPM falla con las versiones actuales de Firebase (firebase_auth fija
      # firebase-ios-sdk 12.19.0 y firebase_core/storage/messaging fijan
      # 12.19.3). Con CocoaPods todos usan 12.19.3 y resuelven bien.
      # Ademas flutter_local_notifications solo soporta CocoaPods.
      - name: Usar CocoaPods en lugar de Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar iOS sin firma
        run: flutter build ios --release --no-codesign

      - name: Empaquetar IPA sin firma
        working-directory: build/ios/iphoneos
        run: |
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qq -r -9 FlutterIpaExport.ipa Payload

      - name: Publicar IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: REPCAMPUSOFT-ipa-sin-firma
          path: build/ios/iphoneos/FlutterIpaExport.ipa
          if-no-files-found: error
